version: '3.8'

services:
  mariadb:
    image: mariadb:10.6
    container_name: mariadb
    environment:
      MARIADB_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - ./docker/mysql-data:/var/lib/mysql
      - ./src/main/resources/create_table.sql:/docker-entrypoint-initdb.d/create_table.sql

volumes:
  mysql-data: